services:
  postgres:
    image: postgres:18-alpine
    container_name: crown-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crown_accumulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: The123!@
      TZ: Asia/Karachi
    ports:
      - "5432:5432"
    volumes:
      - crown_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crown_accumulator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crown_postgres_data:
